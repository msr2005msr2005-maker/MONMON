
name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable
          cache: true

      - name: Prepare Firebase configuration
        run: |
          set -e
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json /tmp/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("/tmp/google-services.json") as f:
              data = json.load(f)
          clients = data.get("client", [])
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.example.monmon"
              for c in clients
          ):
              raise SystemExit("ERROR: Firebase package name mismatch")
          print("Firebase configuration validated.")
          PY

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name monmon \
            .
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          content = settings.read_text()
          plugin = 'id "com.google.gms.google-services" version "4.4.1" apply false'
          if plugin not in content:
              marker = "plugins {"
              assert marker in content, "Settings plugins block not found"
              content = content.replace(marker, marker + "\n    " + plugin, 1)
              settings.write_text(content)

          app = Path("android/app/build.gradle")
          content = app.read_text()
          plugin = 'id "com.google.gms.google-services"'
          if plugin not in content:
              marker = "plugins {"
              assert marker in content, "App plugins block not found"
              content = content.replace(marker, marker + "\n    " + plugin, 1)
              app.write_text(content)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Firebase setup
        run: |
          test -f android/app/google-services.json
          grep -q 'com.google.gms.google-services' android/app/build.gradle
          grep -q 'com.google.gms.google-services' android/settings.gradle

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MONMON-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
