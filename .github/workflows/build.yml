name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # أو الإصدار الذي تفضله

      # هنا تم تعديل الأمر وإضافة البيئة البرمجية لمنع فحص المجلدات الفرعية القديمة تماماً
      - name: Get dependencies
        run: flutter pub get
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Build APK
        run: flutter build apk --release --no-pub
